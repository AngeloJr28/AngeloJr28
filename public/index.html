<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JELO ELITE AI</title>
    <style>
        :root { --neon: #00f2ff; --pink: #ff007a; --bg: #050505; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; padding: 20px; margin: 0; }
        .glass { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 20px; margin-bottom: 15px; }
        .bar { height: 10px; background: #1a1a1a; border-radius: 5px; overflow: hidden; margin: 8px 0; }
        .fill { height: 100%; width: 0%; transition: 1s; background: var(--neon); }
        input { width: 100%; padding: 18px; border-radius: 15px; border: 1px solid #333; background: #111; color: white; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 18px; background: linear-gradient(90deg, var(--neon), #7000ff); border: none; border-radius: 15px; color: white; font-weight: 900; margin-top: 10px; }
    </style>
</head>
<body>
    <div style="text-align: center; margin-bottom: 20px;">
        <h1 style="font-size: 24px; font-weight: 900;">JELO<span style="color:var(--neon)">ELITE</span></h1>
        <div id="w-display" style="color: #666; font-size: 12px;">MASS: -- KG</div>
    </div>

    <div class="glass">
        <h2 style="font-size: 11px; color: var(--neon); letter-spacing: 2px;">CALORIE INTAKE</h2>
        <div id="c-text" style="font-size: 24px; font-weight: bold;">0 / --</div>
        <div class="bar"><div id="c-fill" class="fill"></div></div>
    </div>

    <div class="glass">
        <h2 style="font-size: 11px; color: var(--pink); letter-spacing: 2px;">PROTEIN INTAKE</h2>
        <div id="p-text" style="font-size: 24px; font-weight: bold;">0 / --</div>
        <div class="bar"><div id="p-fill" class="fill" style="background: var(--pink);"></div></div>
    </div>

    <div class="glass">
        <h2 style="font-size: 11px; color: #444; letter-spacing: 2px;">LOG BY WEIGHT</h2>
        <input type="text" id="userInput" placeholder="Ex: 150g fried chicken">
        <button onclick="send()">ANALYZE & LOG</button>
    </div>

    <script>
        let currentWeight = 0;

        async function updateUI() {
            const res = await fetch('/stats');
            const s = await res.json();
            currentWeight = s.weight || 80; // Fallback to 80

            // CALC TARGETS
            const calTarget = Math.round(currentWeight * 33);
            const proTarget = Math.round(currentWeight * 2);

            document.getElementById('w-display').innerText = `CORE MASS: ${currentWeight} KG`;
            
            document.getElementById('c-text').innerText = `${s.calories} / ${calTarget}`;
            document.getElementById('c-fill').style.width = `${(s.calories/calTarget)*100}%`;

            document.getElementById('p-text').innerText = `${s.protein}g / ${proTarget}g`;
            document.getElementById('p-fill').style.width = `${(s.protein/proTarget)*100}%`;
        }

        async function send() {
            const input = document.getElementById('userInput');
            const btn = document.querySelector('button');
            if(!input.value) return;

            btn.innerText = "CALCULATING...";
            await fetch('/track', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message: input.value, currentWeight })
            });
            input.value = "";
            btn.innerText = "ANALYZE & LOG";
            updateUI();
        }
        updateUI();
    </script>
</body>
</html>
