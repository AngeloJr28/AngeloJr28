<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JELO ELITE MANUAL</title>
    <style>
        :root { --neon: #00f2ff; --pink: #ff007a; --bg: #050505; }
        body { font-family: -apple-system, system-ui; background: var(--bg); color: white; padding: 20px; margin: 0; }
        .glass { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 20px; margin-bottom: 15px; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.8); }
        h2 { font-size: 11px; color: var(--neon); letter-spacing: 2px; margin: 0 0 10px 0; text-transform: uppercase; }
        
        /* Neon Progress Bars */
        .bar { height: 12px; background: #1a1a1a; border-radius: 6px; overflow: hidden; margin: 10px 0; }
        .fill { height: 100%; width: 0%; transition: 1.2s cubic-bezier(0.1, 0.7, 1.0, 0.1); }
        
        /* Inputs & Controls */
        input { width: 100%; padding: 16px; border-radius: 12px; border: 1px solid #333; background: #111; color: white; margin-bottom: 10px; box-sizing: border-box; font-size: 16px; outline: none; }
        input:focus { border-color: var(--neon); }
        button { width: 100%; padding: 18px; background: linear-gradient(90deg, var(--neon), #7000ff); border: none; border-radius: 12px; color: white; font-weight: 900; letter-spacing: 1px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        button:active { transform: scale(0.97); opacity: 0.9; }
        
        .workout-box { border-left: 3px solid var(--pink); padding-left: 15px; font-size: 14px; color: #ccc; line-height: 1.5; font-style: italic; }
        .history-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; font-size: 13px; }
    </style>
</head>
<body>
    <div style="text-align: center; margin-bottom: 25px;">
        <h1 style="font-size: 26px; font-weight: 900; margin: 0;">JELO<span style="color:var(--neon)">ELITE</span></h1>
        <div style="font-size: 10px; color: #444; margin-top: 5px; font-weight: bold;">CORE ECOSYSTEM v1.0</div>
    </div>

    <div class="glass">
        <h2>GOAL: 80.0 KG (TARGET)</h2>
        <div id="weight-text" style="font-size: 28px; font-weight: 900; color: var(--pink);">-- KG</div>
        <div class="bar"><div id="weight-fill" class="fill" style="background: var(--pink); box-shadow: 0 0 10px var(--pink);"></div></div>
    </div>

    <div class="glass">
        <h2>DAILY PROTEIN (GOAL 150g)</h2>
        <div id="p-text" style="font-size: 28px; font-weight: 900;">0g</div>
        <div class="bar"><div id="p-fill" class="fill" style="background: var(--neon); box-shadow: 0 0 10px var(--neon);"></div></div>
    </div>

    <div class="glass">
        <h2>TODAY'S MACHINE FOCUS</h2>
        <div id="workout-desc" class="workout-box">Initializing daily routine...</div>
    </div>

    <div class="glass">
        <h2 style="color: #666;">LOG PROTEIN INTAKE</h2>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="foodName" placeholder="Food Name" style="flex: 2;">
            <input type="number" id="proteinAmt" placeholder="Grams" style="flex: 1;">
        </div>
        <button onclick="saveMeal()">ADD TO MACROS</button>

        <div style="margin: 25px 0; border-top: 1px solid #222;"></div>

        <h2 style="color: #666;">LOG CORE MASS</h2>
        <input type="number" id="weightVal" placeholder="Current weight (kg)">
        <button onclick="saveWeight()" style="background: #222; box-shadow: none;">UPDATE WEIGHT</button>
    </div>

    <div class="glass">
        <h2>WEIGHT PROGRESS HISTORY</h2>
        <div id="weight-history-list"></div>
    </div>

    <script>
        const workouts = [
            "SUN: Rest Day - Active Recovery & Stretching",
            "MON: Chest/Triceps - Chest Press Machine, Pec Deck, Tricep Machine (4x12)",
            "TUE: Back/Biceps - Lat Pulldowns, Seated Row Machine, Machine Curls (4x12)",
            "WED: Legs - Leg Press, Leg Extension, Seated Leg Curl (4x12)",
            "THU: Shoulders - Shoulder Press Machine, Lateral Raise Machine (4x12)",
            "FRI: Full Body Machine Circuit - Chest, Back, Legs (3x15)",
            "SAT: Rest Day - Prepare for Weekly Reset"
        ];

        async function updateUI() {
            try {
                const res = await fetch('/stats');
                const s = await res.json();
                
                // Protein Progress
                const protein = s.protein || 0;
                document.getElementById('p-text').innerText = `${protein}g`;
                document.getElementById('p-fill').style.width = `${Math.min((protein/150)*100, 100)}%`;
                
                // Weight Progress toward 80kg
                const weight = s.weight || 0;
                document.getElementById('weight-text').innerText = `${weight} KG`;
                if (weight > 0) {
                    const diff = Math.abs(weight - 80);
                    const progress = Math.max(100 - diff, 0);
                    document.getElementById('weight-fill').style.width = `${progress}%`;
                }

                // Daily Routine
                const day = new Date().getDay();
                document.getElementById('workout-desc').innerText = workouts[day];

                // History List
                const hRes = await fetch('/weight-history');
                const history = await hRes.json();
                document.getElementById('weight-history-list').innerHTML = history.map(h => `
                    <div class="history-item">
                        <span>${new Date(h.date).toLocaleDateString()}</span>
                        <span style="color:var(--pink); font-weight:bold;">${h.weight} kg</span>
                    </div>
                `).join('') || "No weight logs found.";
            } catch (e) { console.error("UI Update Sync Failed"); }
        }

        async function saveMeal() {
            const item = document.getElementById('foodName').value;
            const value = document.getElementById('proteinAmt').value;
            if (!value) return;

            await fetch('/manual-track', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ type: 'meal', item, value: parseFloat(value) })
            });
            document.getElementById('foodName').value = '';
            document.getElementById('proteinAmt').value = '';
            updateUI();
        }

        async function saveWeight() {
            const value = document.getElementById('weightVal').value;
            if (!value) return;

            await fetch('/manual-track', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ type: 'weight', value: parseFloat(value) })
            });
            document.getElementById('weightVal').value = '';
            updateUI();
        }

        // Auto-load on startup
        updateUI();
    </script>
</body>
</html>
