<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JELO ELITE MANUAL</title>
    <style>
        :root { --neon: #00f2ff; --pink: #ff007a; --bg: #050505; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; padding: 20px; margin: 0; }
        .glass { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 20px; margin-bottom: 15px; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.8); }
        h2 { font-size: 11px; color: var(--neon); letter-spacing: 2px; margin: 0 0 10px 0; text-transform: uppercase; }
        .bar { height: 12px; background: #1a1a1a; border-radius: 6px; overflow: hidden; margin: 10px 0; }
        .fill { height: 100%; width: 0%; transition: 1.2s cubic-bezier(0.1, 0.7, 1.0, 0.1); }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #333; background: #111; color: white; margin-bottom: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 18px; background: linear-gradient(90deg, var(--neon), #7000ff); border: none; border-radius: 12px; color: white; font-weight: 900; letter-spacing: 1px; box-shadow: 0 0 15px rgba(0, 242, 255, 0.3); }
        .workout-box { border-left: 3px solid var(--pink); padding-left: 15px; font-size: 14px; color: #ccc; line-height: 1.5; }
        .weight-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222; font-size: 13px; }
    </style>
</head>
<body>
    <div style="text-align: center; margin-bottom: 25px;">
        <h1 style="font-size: 26px; font-weight: 900; margin: 0;">JELO<span style="color:var(--neon)">ELITE</span></h1>
    </div>

    <div class="glass">
        <h2>GOAL: 80 KG (60 DAY TARGET)</h2>
        <div id="weight-text" style="font-size: 28px; font-weight: 900; color: var(--pink);">-- KG</div>
        <div class="bar"><div id="weight-fill" class="fill" style="background: var(--pink); box-shadow: 0 0 10px var(--pink);"></div></div>
    </div>

    <div class="glass">
        <h2>DAILY PROTEIN (GOAL 150g)</h2>
        <div id="p-text" style="font-size: 28px; font-weight: 900;">0g</div>
        <div class="bar"><div id="p-fill" class="fill" style="background: var(--neon); box-shadow: 0 0 10px var(--neon);"></div></div>
    </div>

    <div class="glass">
        <h2>TODAY'S MACHINE FOCUS</h2>
        <div id="workout-desc" class="workout-box">Loading...</div>
    </div>

    <div class="glass">
        <h2>LOG DATA</h2>
        <input type="text" id="itemName" placeholder="Meal (e.g. Chicken Breast)">
        <input type="number" id="itemVal" placeholder="Protein Grams">
        <button onclick="logData('meal')">ADD TO MACROS</button>
        <div style="margin: 20px 0; border-top: 1px solid #222;"></div>
        <input type="number" id="weightVal" placeholder="Current Weight (kg)">
        <button onclick="logData('weight')" style="background: #222; box-shadow: none;">LOG WEIGHT</button>
    </div>

    <div class="glass">
        <h2>WEIGHT PROGRESS LOG</h2>
        <div id="weight-history-list"></div>
    </div>

    <script>
        const workouts = [
            "SUN: Rest Day - Active Recovery & Stretching",
            "MON: Chest/Triceps - Chest Press Machine, Pec Deck, Tricep Machine (4x12)",
            "TUE: Back/Biceps - Lat Pulldowns, Seated Row Machine, Machine Curls (4x12)",
            "WED: Legs - Leg Press, Leg Extension, Seated Leg Curl (4x12)",
            "THU: Shoulders - Shoulder Press Machine, Lateral Raise Machine (4x12)",
            "FRI: Full Body Machine Circuit - Chest, Back, Legs (3x15)",
            "SAT: Rest Day - Prepare for Weekly Reset"
        ];

        async function updateUI() {
            const res = await fetch('/stats');
            const s = await res.json();
            
            document.getElementById('p-text').innerText = `${s.protein}g`;
            document.getElementById('p-fill').style.width = `${Math.min((s.protein/150)*100, 100)}%`;
            
            document.getElementById('weight-text').innerText = `${s.weight} KG`;
            // Visualization: Closer to 80kg fills the bar
            const weightDiff = Math.abs(s.weight - 80);
            const weightProgress = Math.max(100 - weightDiff, 0);
            document.getElementById('weight-fill').style.width = `${weightProgress}%`;

            const day = new Date().getDay();
            document.getElementById('workout-desc').innerText = workouts[day];

            const hRes = await fetch('/weight-history');
            const history = await hRes.json();
            document.getElementById('weight-history-list').innerHTML = history.map(h => `
                <div class="weight-item">
                    <span>${new Date(h.date).toLocaleDateString()}</span>
                    <span style="color:var(--pink); font-weight:bold;">${h.weight} kg</span>
                </div>
            `).join('');
        }

        async function logData(type) {
            const item = document.getElementById('itemName').value;
            const val = type === 'meal' ? document.getElementById('itemVal').value : document.getElementById('weightVal').value;
            if(!val) return;

            await fetch('/manual-track', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ type, item, value: val })
            });
            updateUI();
        }
        updateUI();
    </script>
</body>
</html>
